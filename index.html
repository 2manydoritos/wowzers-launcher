<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta charset="UTF-8">
<style>

@font-face {
  font-family: 'HeaderFont';
  src: url('header.woff') format('woff'),
       url('header.ttf') format('truetype');
}

@font-face {
  font-family: 'BodyFont';
  src: url('body2.otf') format('opentype');
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: url('bg.jpg') center/cover no-repeat, #2b1d10;
  font-family: 'HeaderFont', Georgia, serif;
  color: #e8d9b0;
  padding: 28px;
  box-sizing: border-box;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.18);
  z-index: 0;
}

.frame {
  display: inline-block;
  max-width: 420px;
  border-radius: 10px;
  padding: 24px 28px;
  background: rgba(15, 10, 6, 0.45);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
}

h1 {
  font-family: 'HeaderFont', Georgia, serif;
  font-size: 64px;
  color: #f0c975;
  text-shadow: 0 0 8px rgba(240, 201, 117, 0.4), 1px 1px 2px #000;
  margin: 0 0 2px 0;
  letter-spacing: 1px;
}

.sub {
  font-family: 'HeaderFont', Georgia, serif;
  font-size: 28px;
  color: #b89a63;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

hr {
  border: none;
  border-top: 1px solid rgba(184, 154, 99, 0.35);
  margin-bottom: 20px;
}

.info p {
  font-size: 25px;
  line-height: 1.8;
  margin: 6px 0;
}

.info b {
  font-family: 'HeaderFont', Georgia, serif;
  color: #f0c975;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.status {
  color: #7fbf5f;
  font-weight: 600;
}

a {
  font-family: 'HeaderFont', Georgia, serif;
  color: #f0c975;
  text-decoration: none;
  border-bottom: 1px dotted #a8863f;
}
a:hover {
  color: #ffdf9a;
}
</style>
</head>
<body>
  <div class="frame">
    <h1>Wowzers</h1>
    <div class="sub">3.3.5a &nbsp;&middot;&nbsp; AzerothCore</div>
    <hr>
    <div class="info">
      <p><b>Status:</b> <span class="status">Online</span></p>
      <p>Welcome! Join the Discord for updates and patch notes.</p>
      <p><a href="https://discord.gg/5Afw2WMg4">Discord</a></p>
    </div>
  </div>
</body>
</html>
